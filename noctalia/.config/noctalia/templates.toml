[theme.templates.user.fcitx5_mellow_theme]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/fcitx5-mellow/theme.conf"
output_path = "$XDG_DATA_HOME/fcitx5/themes/Mellow-Graphite-Noctalia/theme.conf"
index = 10

[theme.templates.user.fcitx5_mellow_panel]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/fcitx5-mellow/panel.svg"
output_path = "$XDG_DATA_HOME/fcitx5/themes/Mellow-Graphite-Noctalia/panel.svg"
index = 20

[theme.templates.user.fcitx5_mellow_highlight]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/fcitx5-mellow/highlight.svg"
output_path = "$XDG_DATA_HOME/fcitx5/themes/Mellow-Graphite-Noctalia/highlight.svg"
index = 30
post_hook = "busctl --user call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true"
